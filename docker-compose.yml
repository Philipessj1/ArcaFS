services:
  api:
    build: .
    container_name: arcafs-api
    restart: always

    ports:
      - "8000:8000"

    env_file:
      - .env
    
    depends_on:
      - postgres
    
    volumes:
      - ./storage/uploads:/app/storage/uploads
  
  postgres:
    image: postgres:17
    container_name: arcafs-postgres
    restart: always

    environment:
      POSTGRES_USER: arcafs
      POSTGRES_PASSWORD: arcafs123
      POSTGRES_DB: arcafs_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: