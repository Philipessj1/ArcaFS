services:
  api:
    build: .
    container_name: arcafs-api
    restart: always

    ports:
      - "8000:8000"

    env_file:
      - .env
    
    environment:
      DATABASE_URL: postgresql://arcafs:arcafs123@postgres:5432/arcafs_db

    depends_on:
      postgres:
        condition: service_healthy
    
    volumes:
      - ./storage/uploads:/app/storage/uploads
  
  postgres:
    image: postgres:17
    container_name: arcafs-postgres
    restart: always

    environment:
      POSTGRES_USER: arcafs
      POSTGRES_PASSWORD: arcafs123
      POSTGRES_DB: arcafs_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arcafs -d arcafs_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: